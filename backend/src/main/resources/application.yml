server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: skillchain-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skillchain_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 5MB
  storage:
    provider: ${STORAGE_PROVIDER:auto}
    s3:
      bucket: ${S3_BUCKET:${AWS_S3_BUCKET:}}
      region: ${S3_REGION:${AWS_REGION:us-east-1}}
      access-key: ${S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
      secret-key: ${S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
      endpoint: ${S3_ENDPOINT:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
